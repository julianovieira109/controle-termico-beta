name: Homologacao do Acervo Beta

on:
  pull_request:
    paths:
      - 'src/routes/justification-archive.js'
      - 'src/routes/system.js'
      - 'src/server.js'
      - 'src/db/migrate.js'
      - 'src/db/migrations/20261113_acervo_justificativas.sql'
      - 'public/js/justification-archive.js'
      - 'public/js/core.js'
      - 'public/js/help-manual.js'
      - 'public/index.html'
      - 'test/justification-*'
      - '.github/workflows/acervo-beta-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar sintaxe
        run: |
          node --check src/routes/justification-archive.js
          node --check public/js/justification-archive.js
          node --check src/routes/system.js
          node --check src/db/migrate.js
          node --check src/server.js
      - name: Rodar testes de regressao
        run: npm test
