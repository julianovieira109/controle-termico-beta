name: Validacao temporaria Beta102 5x2
on:
  push:
    branches:
      - fix/5x2-noturno-completo-e-auditoria-escalas
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:sizes
      - run: npm run audit:startup
