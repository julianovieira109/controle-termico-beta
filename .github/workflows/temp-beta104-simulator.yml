name: Validacao temporaria Beta104 simulador
on:
  push:
    branches:
      - fix/5x2-somente-simulador-senior
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: controle_termico_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROSTER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/controle_termico_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/controle_termico_test
      JWT_SECRET: teste-beta104
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:sizes
      - run: npm run audit:startup
